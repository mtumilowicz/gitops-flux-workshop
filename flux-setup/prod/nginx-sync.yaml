apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nginx-prod
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 20s
  timeout: 2m
  path: ./apps/nginx/overlays/prod
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: gitops-flux-workshop
  dependsOn:
    - name: namespaces-prod
  decryption:
    provider: sops
    secretRef:
      name: sops-age
